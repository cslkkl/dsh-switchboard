# dsh-switchboard 的 Loader 层：在 profile 根上插入本插件一行。
#
# ⚠️ 这是**首次默认值**，不是唯一入口：运行期以
# $DSH_HOME/storages/dsh-switchboard/rules.json 为准（设置页写那里，改动即时生效，
# 不触发插件树重建）。两处都没有默认路由时，子智能体保持继承 Lead 的路由。
#
# ⚠️ 不要让别的 patch 用同一个 id 整行覆盖这里 —— 后层是**整行替换**，不深合并。
- insert:
    - id: dsh-switchboard
      name: dsh-switchboard
      config:
        enabled: true
        # null = 不干预（推荐）。要「所有子智能体都换模型」就填一条路由。
        defaultRoute: null
        # 规则：match 命中队友名或委派描述（子串、不区分大小写）；名字优先。
        # 例：
        # rules:
        #   - match: reviewer
        #     provider: cpa-trae
        #     model: trae/deepseek-v4.1-flash
        rules: []
        # 只作用于直接子代；深层嵌套默认不动。
        maxDepth: 1
        # fork 子代默认不改：换路由会破坏继承前缀的 KV 复用。
        applyToFork: false
